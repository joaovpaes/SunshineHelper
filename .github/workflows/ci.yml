name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (Release, treat warnings as errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Check coverage (Phase 1 gate, item 5)
        shell: pwsh
        run: ./scripts/check-coverage.ps1 -ResultsDirectory TestResults -Minimum 80

      - name: Publish SunshineHelper.Trigger with NativeAOT
        # SunshineHelper.Trigger is meant to publish as a native binary
        # (docs/adr/0002-arquitetura-do-nucleo.md). The trimmer/AOT analyzer only runs
        # during an actual publish, so without this step an AOT-incompatible dependency
        # would go unnoticed until someone tried to ship a release.
        #
        # PublishAot lives in the .csproj on purpose and is NOT passed here: a property
        # on the command line applies to every project in the graph, which makes the SDK
        # add its implicit ILCompiler reference to SunshineHelper.Protocol too — and that
        # implicit reference cannot coexist with the PackageVersion that pins ILCompiler
        # centrally (NU1009).
        run: >
          dotnet publish src/SunshineHelper.Trigger/SunshineHelper.Trigger.csproj
          --configuration Release
          --runtime win-x64

      - name: The published auxiliary ignores variables that load DLLs (ADR 0017)
        # The elevated-close mode runs elevated with the user's environment, which any program of the
        # user can change. A .NET runtime that honored a custom GC, a startup hook or a profiler from
        # these variables would load an attacker's DLL elevated. The DLLs named here do not exist: if
        # the runtime tried to load any of them, the process would fail to start instead of answering
        # 10 (bad arguments).
        shell: pwsh
        env:
          DOTNET_GCName: nope-gc.dll
          DOTNET_GCPath: C:\nope\nope-gc.dll
          COMPlus_GCName: nope-gc.dll
          COMPlus_GCPath: C:\nope\nope-gc.dll
          DOTNET_STARTUP_HOOKS: C:\nope\nope-hook.dll
          CORECLR_ENABLE_PROFILING: '1'
          CORECLR_PROFILER: '{00000000-0000-0000-0000-000000000001}'
          CORECLR_PROFILER_PATH: C:\nope\nope-profiler.dll
          CORECLR_PROFILER_PATH_64: C:\nope\nope-profiler.dll
          DOTNET_EnableEventPipe: '1'
        run: |
          $exe = Get-ChildItem -Path src/SunshineHelper.Trigger/bin/Release -Recurse -Filter SunshineHelper.Trigger.exe |
            Where-Object { $_.DirectoryName -like '*publish*' } | Select-Object -First 1
          if (-not $exe) { throw 'Published SunshineHelper.Trigger.exe not found.' }
          & $exe.FullName elevated-close close abc 1
          $code = $LASTEXITCODE
          Write-Host "Exit code: $code"
          if ($code -ne 10) { throw "Expected exit code 10 (bad arguments), got $code." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

  format-and-analyzers:
    name: Format and analyzers
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting (dotnet format --verify-no-changes)
        run: dotnet format --verify-no-changes --no-restore

      - name: Build with analyzers as errors
        run: dotnet build --configuration Release --no-restore
        # Directory.Build.props sets TreatWarningsAsErrors + EnforceCodeStyleInBuild + AnalysisLevel,
        # so analyzer and style violations already fail this step.

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: List vulnerable packages (direct and transitive)
        shell: pwsh
        run: |
          $output = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match "has the following vulnerable packages") {
            Write-Error "Vulnerable packages found. See the log above."
            exit 1
          }

  codeql:
    name: CodeQL (C#)
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@faaa5d804fc648d0fdb28822a8e36cf7d0a6132c # v4.37.7
        with:
          category: "/language:csharp"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
